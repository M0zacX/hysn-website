<style>*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--white);font-family:var(--font-body);color:var(--ink-900);-webkit-font-smoothing:antialiased}
a{color:var(--link-color)}a:hover{color:var(--link-color-hover)}
::selection{background:var(--violet-100);color:var(--violet-800)}
section[id]{scroll-margin-top:86px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px var(--violet-200)}
@keyframes hysn-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hysn-marquee-track{animation:hysn-marquee 30s linear infinite}
.hysn-marquee:hover .hysn-marquee-track{animation-play-state:paused}
@keyframes hRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes hLine{from{transform:translateY(112%)}to{transform:none}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes arrowFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes glare{0%,52%{transform:translateX(-30%) skewX(-18deg);opacity:0}60%{opacity:1}88%,100%{transform:translateX(440%) skewX(-18deg);opacity:0}}
.glare{position:absolute;top:-30%;bottom:-30%;left:-40%;width:38%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.13) 45%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.13) 55%,rgba(255,255,255,0) 100%);pointer-events:none;animation:glare 7s var(--ease-standard) infinite}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tickIn{from{opacity:0;transform:translateY(-55%)}to{opacity:1;transform:none}}
@keyframes ringOut{from{transform:scale(1);opacity:.5}to{transform:scale(1.6);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.h-el{opacity:0;animation:hRise .9s var(--ease-out) both}
.h-mask{display:block;overflow:hidden}
.h-mask>span{display:block;transform:translateY(112%);animation:hLine .9s var(--ease-out) both}
[data-rv] .h-mask>span{animation:none;transition:transform .9s var(--ease-out) var(--rd,0ms)}
[data-rv].in .h-mask>span{transform:none}
.tick{display:block;animation:tickIn .35s var(--ease-out)}
.toast{animation:toastIn .5s var(--ease-out) both}
[data-rv]{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease-out) var(--rd,0ms),transform .8s var(--ease-out) var(--rd,0ms)}
[data-rv="l"]{transform:translateX(-30px)}[data-rv="r"]{transform:translateX(30px)}[data-rv="z"]{transform:translateY(24px) scale(.965)}
[data-rv].in{opacity:1;transform:none}
[data-rv="stage"]{opacity:1;transform:none}
.step-w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:2px}
.step-w>span{display:inline-block;transform:translateY(115%);transition:transform .75s var(--ease-out) var(--rd,0ms)}
[data-rv].in .step-w>span{transform:none}
.step-a{opacity:0;transform:translateX(-16px);transition:opacity .6s var(--ease-out) var(--rd,0ms),transform .6s var(--ease-out) var(--rd,0ms)}
[data-rv].in .step-a{opacity:1;transform:none}
.srow{opacity:0;transform:translateY(12px);transition:opacity .65s var(--ease-out) var(--rd,0ms),transform .65s var(--ease-out) var(--rd,0ms)}
[data-rv].in .srow{opacity:1;transform:none}
[data-rv] .mark{transform:scale(.3);opacity:0;transition:transform .5s var(--ease-out) var(--rd,0ms),opacity .4s var(--ease-out) var(--rd,0ms)}
[data-rv].in .mark{transform:scale(1);opacity:1}
.cmp-row{border-radius:10px;transition:background var(--duration-base) var(--ease-standard)}
.cmp-row:hover{background:var(--violet-050)}
.hvc{transition:transform .35s var(--ease-out),box-shadow .35s var(--ease-out)}
.hvc:hover{transform:translateY(-5px)}
.hvc-s:hover{box-shadow:var(--shadow-lg)}
.hvm{overflow:hidden;border-radius:var(--radius-sm)}
.hvm img{display:block;width:100%;transition:transform .6s var(--ease-out)}
.hvc:hover .hvm img{transform:scale(1.045)}
.cta-r svg{transition:transform .3s var(--ease-out)}
.cta-r:hover svg{transform:translateX(4px)}
.navlnk{position:relative;transition:color var(--duration-base) var(--ease-standard)}
.navlnk:hover{color:var(--ink-900)!important}
header[data-dark] .navlnk:hover{color:var(--white)!important}
header[data-dark] nav{border-color:rgba(255,255,255,.16)!important}
.navlnk::after{content:"";position:absolute;left:0;right:100%;bottom:-5px;height:2px;background:var(--gradient-brand);transition:right .3s var(--ease-out)}
.navlnk:hover::after{right:0}
.reel img{transition:transform .8s var(--ease-out)}
.reel:hover img{transform:scale(1.04)}
.play{position:relative;transition:transform .3s var(--ease-out)}
.reel:hover .play{transform:scale(1.07)}
.play::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,255,255,.75);animation:ringOut 2.8s var(--ease-out) infinite}
.live-dot{animation:blink 2.6s var(--ease-standard) infinite}
.fld{transition:border-color var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard)}
.fld:focus{outline:none;border-color:var(--violet-400)!important;box-shadow:0 0 0 3px var(--violet-100)}
.fld-dark{transition:border-color var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard)}
.fld-dark::placeholder{color:rgba(255,255,255,.48)}
.fld-dark:focus{outline:none;border-color:var(--violet-400)!important;box-shadow:0 0 0 3px rgba(123,75,196,.28)}
.pop{animation:toastIn .55s var(--ease-out) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}[data-rv],.h-el,.h-mask>span,.step-w>span,.step-a,.srow,[data-rv] .mark{opacity:1!important;transform:none!important}}

@media (max-width:900px){[data-grid="aktion"],[data-grid="stack"],[data-grid="reel"],[data-grid="faq"]{grid-template-columns:minmax(0,1fr)!important}[data-el="boards"]{justify-self:center!important;max-width:440px!important;margin-top:36px!important}[data-grid="faq"]>div{position:static!important}[data-grid="footer"]{grid-template-columns:minmax(0,1fr)!important;gap:var(--space-6)!important}[data-grid="offerboard"]{grid-template-columns:minmax(0,1fr)!important}[data-grid="offerboard"] img{min-height:150px!important;max-height:190px}[data-grid="aktion"] [data-rv="z"]{margin-right:0!important}[data-grid="aktion"] [data-rv="z"]>div:last-child{right:0!important}}

@media (max-width:640px){[data-el="seal"]{left:auto!important;right:-6px!important;top:auto!important;bottom:-30px!important;transform:rotate(-6deg) scale(.62)!important;transform-origin:bottom right}[data-el="boards"]{margin-top:14px!important}[data-nav="site"]{gap:var(--space-4)!important}[data-nav="site"] a[href="#kontakt"]{padding:10px 16px!important;font-size:12.5px!important;white-space:nowrap}[data-row="bonus"]>div:last-child{flex-direction:column;align-items:stretch;width:100%}[data-row="bonus"]>div:last-child>span[aria-hidden]{align-self:center}[data-row="cta"] form>*{flex:1 1 100%!important}[data-row="cta"] form{gap:8px!important}[data-row="cta"] input.fld-dark{padding:13px 18px!important;font-size:14px!important}[data-row="cta"] button.cta-r,[data-row="cta"] .cta-r{width:100%;justify-content:center;padding:15px 24px!important}[data-cta]{flex-direction:column;align-items:stretch}[data-cta] a{width:100%}[data-nav="site"] nav{display:none!important}[data-nav="site"]{flex-wrap:nowrap!important;justify-content:space-between!important;gap:12px!important}[data-nav="site"] a[href="#kontakt"]{padding:9px 14px!important;font-size:12px!important}section#aktion>div{padding-top:88px!important}[data-grid="aktion"] h1{font-size:22px!important;line-height:1.14!important}[data-grid="aktion"] h1+p{font-size:14px!important;line-height:1.5!important}[data-nav="site"] a[href="#kontakt"]{white-space:nowrap}[data-grid="aktion"]{gap:16px!important}[data-grid="aktion"]>div:nth-child(2){gap:12px!important}[data-grid="aktion"] [data-rv="z"]{margin-top:2px!important}[data-grid="aktion"] [data-rv="z"]>div:last-child{top:-14px!important;transform:rotate(5deg) scale(.7)!important;transform-origin:top right!important}[data-row="bonus"]{margin-top:16px!important;gap:12px!important}[data-row="bonus"]>div:first-child{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;width:100%}[data-row="bonus"]>div:first-child>div:first-child{font-size:34px!important}[data-row="bonus"]>div:first-child>div:last-child{font-size:13px!important;margin-top:0!important}[data-row="bonus"]>div:last-child{gap:8px!important}[data-row="bonus"]>div:last-child>div{padding:9px 14px!important;border-radius:15px!important}[data-row="cta"]{margin-top:16px!important;gap:12px!important}[data-row="cta"] .cta-r{width:100%;justify-content:center;padding:14px 24px!important}#aktion div:has(>h2){margin:26px 0 14px!important}[data-grid="paket"]{gap:16px!important;row-gap:16px!important}[data-row="bonus"]>div:last-child{flex-direction:column!important;align-items:stretch!important;width:100%!important;gap:10px!important}[data-row="bonus"]>div:last-child>span[aria-hidden]{display:none!important}[data-count]{width:100%;gap:8px!important}[data-count]>span{flex:1 1 0;min-width:0!important;padding:10px 4px!important}[data-count] .tick{font-size:24px!important}}
@media (max-width:560px){[data-nav="site"] a[href^="tel"]{display:none!important}[data-grid="paket"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:0!important;border:1px solid rgba(255,255,255,.16);border-radius:14px;overflow:hidden}[data-grid="paket"]>div{border-top:none!important;padding:18px 16px!important}[data-grid="paket"]>div:nth-child(odd){border-right:1px solid rgba(255,255,255,.16)}[data-grid="paket"]>div:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.16)}[data-grid="paket"]>div>div:first-child{flex-direction:column!important;align-items:flex-start!important;gap:8px!important}}
@media (max-width:480px){[data-count]{flex-wrap:wrap}[data-count]>span{min-width:0!important;flex:1 1 0;padding:9px 4px!important}[data-count] .tick{font-size:22px!important}[data-row="bonus"] img{width:min(32vw,150px)!important}[data-row="bonus"]>div:last-child>div{white-space:normal!important}}
@media (max-width:640px){[data-grid="aktion"]>div:nth-child(2){position:relative;z-index:1}[data-grid="aktion"] [data-rv="z"]{position:absolute!important;top:-48px!important;right:-10%!important;left:auto!important;width:74%!important;max-width:400px!important;margin:0!important;justify-self:auto!important;z-index:0!important;pointer-events:none}[data-grid="aktion"] [data-rv="z"]>div:first-child{opacity:.42;-webkit-mask-image:linear-gradient(180deg,#000 40%,rgba(0,0,0,0) 97%);mask-image:linear-gradient(180deg,#000 40%,rgba(0,0,0,0) 97%)}[data-grid="aktion"] [data-rv="z"]>div:last-child{left:auto!important;right:12%!important;top:68%!important;bottom:auto!important;transform:rotate(-5deg) scale(.55)!important;transform-origin:top right!important}[data-grid="footer"]{gap:var(--space-5)!important}[data-grid="footer"] .f-cta{font-size:12px!important;white-space:nowrap}[data-grid="footer"]>div:nth-child(2)>span,[data-grid="footer"]>div:nth-child(3)>span{display:none}[data-grid="footer"]>div:nth-child(2) nav{flex-direction:row!important;flex-wrap:wrap;gap:10px 22px!important;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}[data-grid="footer"]>div:nth-child(3)>div{gap:8px!important}[data-grid="footer"]>div:nth-child(3) a{font-size:14px!important;gap:10px!important}[data-grid="footer"]>div:nth-child(3) a>span{width:28px!important;height:28px!important;border-radius:8px!important}[data-row="wa"] a{width:100%;justify-content:center;font-size:13px!important;padding:12px 18px!important;white-space:nowrap}footer>div:last-child>div:last-child{margin-top:var(--space-5)!important;flex-direction:column;align-items:center;text-align:center;gap:4px!important}}

</head><body><div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="StepBand.jsx"></script>
<script type="text/babel" src="FeatureMedia.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="Strips.jsx"></script>
<script type="text/babel" src="AktionSection.jsx"></script>
<script type="text/babel" src="WarumSection.jsx"></script>
<script type="text/babel" src="ReelSection.jsx"></script>
<script type="text/babel" src="ContactSection.jsx"></script>
<script type="text/babel" src="FaqSection.jsx"></script>
<script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel">
function App(){
 React.useEffect(()=>{
  let els=Array.from(document.querySelectorAll('[data-rv]'));
  let syn=0;
  const check=()=>{
   const vh=window.innerHeight||document.documentElement.clientHeight;
   els=els.filter((el)=>{
    if(el.getBoundingClientRect().top<vh*.92){if(syn){el.style.transition='none';el.querySelectorAll('.srow,.h-mask>span,.step-w>span,.step-a,.mark').forEach((c)=>{c.style.transition='none'})}el.classList.add('in');return false}
    return true;
   });
   if(!els.length) off();
  };
  const st=window.scrollTo.bind(window);
  window.scrollTo=function(){st.apply(window,arguments);syn=1;try{window.dispatchEvent(new Event('scroll'))}finally{syn=0}};
  const off=()=>{window.removeEventListener('scroll',check);window.removeEventListener('resize',check);clearInterval(iv)};
  const iv=setInterval(check,500);
  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check,{passive:true});
  check();
  return ()=>{off();window.scrollTo=st;};
 },[]);
 return <>
 <SiteHeader/>
 <AktionSection/>
 <StepBand/>
 <Hero/>
 <Features/>
 <WarumSection/>
 <ReelSection/>
 <Strips/>
 <FaqSection/>
 <ContactSection/>
 <SiteFooter/>
</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
